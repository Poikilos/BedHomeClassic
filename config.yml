# BedHomeClassic config
# Location is set half a block above the foot of the bed.

messages:
  home-set: "&7Home set to your bed."
  no-essentials: "&cEssentials not found. BedHomeClassic requires Essentials."
  disabled: "&cBed home setting is disabled."
  obstructed: "&cBed is obstructed (home not set)."

enabled: true
# Name of the Essentials home to set. "home" is the default for /home
home-name: "home"
# Set home on right-click even if the player cannot sleep (daytime, etc.)
set-home-even-if-cannot-sleep: true
