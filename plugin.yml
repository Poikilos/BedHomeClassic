name: BedHomeClassic
main: org.poikilos.bedhomeclassic.BedHomeClassic
version: 1.2.5.2
author: Poikilos
description: Sets Essentials home when you sleep in a bed (Tekkit Classic / CB 1.2.5)
softdepend: [Essentials]

commands:
  bedhome:
    description: BedHomeClassic admin commands
    usage: /bedhome <reload|set-home-even-if-cannot-sleep <true|false>>
    permission: bedhome.admin

permissions:
  bedhome.use:
    description: Allow bed to set home
    default: true
  bedhome.admin:
    description: Admin commands
    default: op
